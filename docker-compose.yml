services:
  postgres:
    image: postgres:16
    container_name: calsync-postgres
    environment:
      POSTGRES_DB: calsync
      POSTGRES_USER: calsync
      POSTGRES_PASSWORD: calsyncpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

  backend:
    build: ./backend
    container_name: calsync-backend
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: always

  frontend:
    build: ./frontend
    container_name: calsync-frontend
    ports:
      - "8000:80"
    restart: always

  ollama:
    image: ollama/ollama:latest
    container_name: calsync-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: always

  brain:
    build: ./brain
    container_name: calsync-brain
    ports:
      - "5005:5005"
    depends_on:
      - ollama
      - backend
    restart: always

volumes:
  ollama-data:
  postgres-data:
