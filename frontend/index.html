<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CalSync AI</title>
</head>
<body>
  <h1>Welcome to CalSync AI</h1>
  <p>Sign in with your Google account to connect your calendar.</p>
  <button id="loginBtn" style="padding: 10px 20px; font-size: 16px;">Sign in with Google</button>
  <p id="status"></p>

  <script>
    const statusEl = document.getElementById("status");
    async function checkAuth() {
      try {
        const res = await fetch(`/auth/me`, {
          credentials: "include"
        });
        if (res.ok) {
          window.location.href = "main.html";
          return;
        }
      } catch (e) {
        console.error(e);
      }
    }
    document.getElementById("loginBtn").addEventListener("click", () => {
      statusEl.textContent = "Redirecting to Google...";
      window.location.href = `/auth/google/login`;
    });
    checkAuth();
  </script>
</body>
</html>
