<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CalSync AI</title>
  <script src="theme.js?v=20260712-theme-toggle"></script>
  <link rel="stylesheet" href="styles.css?v=20260712-theme-toggle" />
</head>
<body>
  <div class="page-shell auth-shell">
    <header class="topbar auth-topbar">
      <div class="brand-block">
        <a class="brand-link" href="index.html"><img src="assets/logo.png" class="app-logo" alt="CalSync AI" /></a>
        <div>
          <p>Plan smarter. Schedule faster. Sync directly with your calendar.</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch theme">
          <span class="theme-toggle-icon" aria-hidden="true"></span>
          <span data-theme-label>Dark</span>
        </button>
      </div>
    </header>

    <main class="auth-main">
      <section class="panel auth-card">
        <div class="panel-inner">
          <p class="eyebrow">Google Calendar connected planning</p>
          <h2 class="hero-title">Start with your calendar in view.</h2>
          <p class="hero-subtitle">
            Sign in to generate a learning plan, shape it into a schedule, and sync approved sessions to your calendar.
          </p>

          <div class="action-row action-row-primary">
            <button id="loginBtn" class="btn btn-primary">Sign in with Google</button>
          </div>

          <p id="status" class="muted-text auth-status"></p>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>© 2026 Naitik Shah. All rights reserved.</p>
    </footer>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const statusEl = document.getElementById("status");
      const loginBtn = document.getElementById("loginBtn");

      async function checkAuth() {
        try {
          const res = await fetch(`/auth/me`, {
            credentials: "include"
          });
          if (res.ok) {
            window.location.href = "main.html";
          }
        } catch (e) {
          console.error(e);
        }
      }

      loginBtn.addEventListener("click", () => {
        statusEl.textContent = "Redirecting to Google...";
        window.location.href = `/auth/google/login`;
      });

      checkAuth();
    });
  </script>
</body>
</html>
